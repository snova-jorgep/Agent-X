# Agent-X: vision-centric agentic tool-use benchmark. Models MUST be multimodal.
# See AGENTX_SETUP.md for setup and run flow.

agentx_options:
  # Task set to infer over: a directory holding dataset.json + the image/ it
  # references. "data/agentx_dataset" = the full 828 (see AGENTX_SETUP.md §2);
  # "data/cpu_runnable" = the 102-task CPU-runnable subset. Switching task sets
  # is just this one line.
  # "data/cpu_runnable" is another option
  dataset_dir: "data/cpu_runnable"
  ground_truth: "data/agentx_dataset/data.json"      # judge --gt_data_path
  tool_meta: "data/agentx_dataset/toolmeta.json"

  tool_server: "http://0.0.0.0:16181"  # AgentLego server, started separately

  # ReAct agent settings.
  max_turn: 10
  batch_size: 8
  # Client-side prompt+generation budget (openai_api.py context_window). NOT the
  # provider's context length — it only decides when the wrapper refuses to send
  # a request. It must exceed prompt + max_turn * max_out_len or the later ReAct
  # turns get dropped: at the old 4096 a single 2048-token turn pushed the
  # history over budget and every subsequent turn returned '' WITHOUT an API
  # call, silently burning the rest of the agent loop.
  max_seq_len: 32768
  query_per_second: 1
  # Per-request max_tokens. Overrides opencompass's 512 default: reasoning-capable
  # gemma-4 endpoints (Together, Novita) emit a separate `reasoning` field and
  # return content='' if the budget runs out before the answer starts.
  max_out_len: 2048
  # ReAct turn boundary — REQUIRED, and not a model-family EOS token.
  # ReAct is a plain-text protocol: the model is supposed to stop after
  # `Action Input:` and let the harness run the tool and supply `Response:`.
  # With no stop sequence it instead writes the WHOLE dialogue in one
  # completion — inventing its own `Response:` lines and ending with
  # `Final Answer:` — and ReActProtocol.parse() then returns the finish action,
  # discarding every Action it emitted. Measured on SambaNova/gemma-4-31B over
  # tasks 0-7: 0/8 tasks called a tool without this, 5/8 (10 calls) with it.
  # Applies to every model family; unlike '<|im_end|>' it is protocol-level,
  # not tokenizer-level. A bare string is accepted and wrapped in a list.
  stop:
    - "Response:"
    - "\nResponse"

  max_num_workers: 8
  limit: 10            # 0 = full 828 tasks; small N = smoke test
  debug: false        # true = OpenCompass sequential in-process (aborts batch on 1st model error); false = isolated tasks, resilient
  request_timeout: 300  # per-request seconds; a stalled provider errors+retries instead of hanging the run forever

  judge: gpt          # gpt | qwen
  run_eval: true      # false = infer only (no judge key needed)
  judge_python: ".venv_agentx_judge/bin/python"  # judge needs openai==0.28.0, isolated venv

max_parallel: 1       # OpenCompass parallelizes across models internally

# openai_api_base must include the full chat completions path.
base_urls:
  SambaNova: "https://api.sambanova.ai/v1/chat/completions"
  Fireworks: "https://api.fireworks.ai/inference/v1/chat/completions"
  Groq:      "https://api.groq.com/openai/v1/chat/completions"
  Cerebras:  "https://api.cerebras.ai/v1/chat/completions"
  Together:  "https://api.together.xyz/v1/chat/completions"
  Novita:    "https://api.novita.ai/openai/v1/chat/completions"

# Per-provider request rate (req/sec), overriding agentx_options.query_per_second.
# Cerebras enforces 5 requests per MINUTE (x-ratelimit-limit-requests-minute: 5),
# and a ReAct task issues up to `max_turn` requests, so it needs 5/60 = 0.083 qps
# with headroom. Omit a provider to use the global default.
provider_query_per_second:
  Cerebras: 0.07

provider_api_keys:
  SambaNova: SAMBANOVA_API_KEY
  Fireworks: FIREWORKS_API_KEY
  Groq:      GROQ_API_KEY
  Cerebras:  CEREBRAS_API_KEY
  Together:  TOGETHER_API_KEY
  Novita:    NOVITA_API_KEY

# canonical alias -> provider model id (vision-capable only). Aliases must match
# the other suites so the `model` column joins in Athena/Grafana. "not_available" = skip.
model_mappings:
  SambaNova:
    #Llama-4-Maverick-17B-128E-Instruct: "Llama-4-Maverick-17B-128E-Instruct"
    Gemma-4-31B:                         "gemma-4-31B-it"
  Fireworks:
  #   Llama-4-Maverick-17B-128E-Instruct: "accounts/fireworks/models/llama4-maverick-instruct-basic"
  #  Gemma-4-31B:                         "accounts/fireworks/models/gemma-4-31b-it" # no serverless supported
    Gemma-4-31B:                         "not_available"  
  Groq:
  #   Llama-4-Maverick-17B-128E-Instruct: "meta-llama/llama-4-maverick-17b-128e-instruct"
    Gemma-4-31B:                         "not_available"
  Cerebras:
  #   Llama-4-Maverick-17B-128E-Instruct: "not_available"
    Gemma-4-31B:                         "gemma-4-31b"
  Together:
  #   Llama-4-Maverick-17B-128E-Instruct: "meta-llama/Llama-4-Maverick-17B-128E-Instruct-FP8"
    Gemma-4-31B:                         "google/gemma-4-31B-it"
  Novita:
  #   Llama-4-Maverick-17B-128E-Instruct: "meta-llama/llama-4-maverick-17b-128e-instruct-fp8"
    Gemma-4-31B:                         "google/gemma-4-31b-it"
